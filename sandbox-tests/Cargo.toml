[package]
name = "worgl-sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Kept out of the contract crate: near-workspaces does not compile to wasm and is heavy.
[dev-dependencies]
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
base64 = "0.22"
