[package]
name = "worgl-token"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wörgl: a fixed-supply, decaying stamp-scrip token on NEAR"
repository = "https://github.com/devendra116/worgl"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
uint = { version = "0.10.2", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
rand = "0.8"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.test]
opt-level = 3

# `cfg(near)` was introduced in near-sdk v5.27.0 and is expected by cargo-near builds
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
